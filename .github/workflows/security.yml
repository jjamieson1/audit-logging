name: Security

# The pre-push hook is a local convenience and is bypassable with
# --no-verify. This workflow is the enforcement point: make it a required
# status check in branch protection and unscanned code cannot merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are pinned to commit SHAs, not tags. A tag is mutable -- whoever
# controls the action can repoint v4 at different code, and this workflow
# runs with repository credentials. The trailing comment records which
# release each SHA corresponds to so the pin stays readable.
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Deliberately not go-version-file: go.mod. That declares the minimum
          # language version (1.22), whereas govulncheck findings are almost
          # always standard-library issues fixed by a newer TOOLCHAIN. Building
          # with the current stable Go is what clears them.
          go-version: stable
          check-latest: true

      - name: Install scanners
        # govulncheck is the only gating check that needs a tool. gosec and
        # gitleaks are non-gating but installed anyway: a secret scan that
        # runs only on the machines of developers who happen to have gitleaks
        # installed is not a secret scan. All three are Go programs, so they
        # install without external download scripts.
        #
        # semgrep (Python), syft and trivy (install scripts) stay out for now
        # -- they would roughly triple the job's runtime for non-gating
        # signal. The scan records them as skipped rather than failing.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/zricethezav/gitleaks/v8@latest

      - name: Run security scan
        run: go run ./cmd/security-dashboard scan --trigger ci

      - name: Upload dashboard and raw reports
        # Runs even when the scan fails -- that is precisely when someone
        # wants to read the report.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-dashboard
          path: |
            security/dashboard.html
            security/badge.svg
            security/runs/
          retention-days: 30
