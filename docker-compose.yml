version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: audit-postgres
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  audit-logging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-logging
    environment:
      PORT: 8090
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgres://audit:audit@postgres:5432/audit?sslmode=disable
      MAX_PAYLOAD_BYTES: 32768
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
